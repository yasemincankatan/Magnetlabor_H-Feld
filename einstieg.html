<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Stark genug fürs Auto?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5ef;
      color: #153e39;
      font: 18px/1.6 system-ui, sans-serif;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 28px 18px;
    }

    .kicker {
      color: #006c57;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.15;
      margin: 14px 0 28px;
    }

    .card {
      background: white;
      border: 1px solid #d4e2db;
      border-radius: 18px;
      padding: clamp(16px, 4vw, 30px);
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #102e2b;
      border-radius: 12px;
    }

    .question {
      margin: 24px 0 0;
      padding: 18px;
      background: #eaf3eb;
      border-radius: 12px;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 650;
    }

    .hint {
      margin-top: 18px;
      color: #506a62;
      font-size: 15px;
    }

    a {
      color: #006c57;
    }
  </style>
</head>

<body>
  <main>
    <div class="kicker">
      LF 5 · Magnetische Grundgrößen
    </div>

    <h1>Stark genug fürs Auto?</h1>

    <section class="card" aria-label="Einstiegsvideo">
      <video controls playsinline preload="metadata">
        <source src="einstieg.mp4" type="video/mp4">

        Dein Browser unterstützt die Videowiedergabe nicht.
        <a href="einstieg.mp4">Video öffnen</a>
      </video>

      <p class="question">
        Wie können wir das Magnetfeld einer Spule verstärken?
      </p>

      <p class="hint">
        Sammelt zunächst eure Vermutungen.
      </p>
    </section>
  </main>
</body>
</html>
